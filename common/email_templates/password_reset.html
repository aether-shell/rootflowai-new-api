<!doctype html>
<html lang="{{.Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{.Title}} · {{.SystemName}}</title>
  <style>
    body { margin: 0; padding: 0; }
    table { border-collapse: separate; border-spacing: 0; }
    a:focus-visible { outline: 3px solid #7cc0ee; outline-offset: 4px; }
    @media only screen and (max-width: 540px) {
      .outer { padding: 24px 16px !important; }
      .content { padding: 24px !important; }
      .title { font-size: 26px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f7f8fa;color:#0b1220;font-family:'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{.Action}} {{.Validity}}</div>
  <table role="presentation" width="100%" style="width:100%;background-color:#f7f8fa;">
    <tr>
      <td class="outer" align="center" style="padding:48px 24px;">
        <table role="presentation" width="512" style="width:100%;max-width:512px;table-layout:fixed;background-color:#ffffff;border:1px solid #eceef1;border-radius:16px;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 8px 24px -12px rgba(15,23,42,0.10);">
          <tr>
            <td class="content" style="padding:32px;">
              <table role="presentation">
                <tr>
                  <td width="32" style="width:32px;vertical-align:middle;">
                    <img src="https://rootflowai.com/rootflow-icon.png" alt="" width="32" height="32" style="display:block;width:32px;height:32px;border:0;border-radius:7px;">
                  </td>
                  <td style="padding-left:10px;vertical-align:middle;font-size:17px;line-height:24px;font-weight:600;letter-spacing:-0.17px;"><span style="color:#0b1220;">ROOT</span><span style="color:#1a6db8;">FLOW</span></td>
                </tr>
              </table>
              <h1 class="title" style="margin:32px 0 12px;color:#0b1220;font-size:30px;line-height:40px;font-weight:600;letter-spacing:-0.36px;">{{.Title}}</h1>
              <p style="margin:0;color:#525c6c;font-size:14px;line-height:24px;">{{.Intro}}<br>{{.Action}}</p>
              <table role="presentation" width="100%" style="width:100%;margin-top:24px;">
                <tr>
                  <td align="center" bgcolor="#1a6db8" style="border-radius:8px;background-color:#1a6db8;">
                    <a href="{{.ResetURL}}" target="_blank" rel="noopener noreferrer" style="display:block;border:1px solid #1a6db8;border-radius:8px;padding:13px 20px;color:#ffffff;background-color:#1a6db8;font-size:14px;font-weight:600;line-height:20px;text-align:center;text-decoration:none;">{{.Button}}</a>
                  </td>
                </tr>
              </table>
              <p style="margin:16px 0 0;color:#525c6c;font-size:12px;line-height:20px;text-align:center;">{{.Validity}}</p>
              <table role="presentation" width="100%" style="width:100%;margin-top:28px;border-top:1px solid #eceef1;">
                <tr>
                  <td style="padding-top:24px;">
                    <p style="margin:0 0 8px;color:#525c6c;font-size:12px;line-height:20px;">{{.Fallback}}</p>
                    <p style="margin:0;font-size:12px;line-height:20px;overflow-wrap:anywhere;word-break:break-all;"><a href="{{.ResetURL}}" target="_blank" rel="noopener noreferrer" style="color:#1a6db8;text-decoration:underline;overflow-wrap:anywhere;word-break:break-all;">{{.ResetURL}}</a></p>
                  </td>
                </tr>
              </table>
              <p style="margin:24px 0 0;color:#636b7b;font-size:12px;line-height:20px;">{{.Ignore}}</p>
            </td>
          </tr>
        </table>
        <p style="margin:20px 0 0;color:#636b7b;font-size:12px;line-height:20px;">{{.SystemName}} · {{.Footer}}</p>
      </td>
    </tr>
  </table>
</body>
</html>
